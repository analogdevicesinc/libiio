include: iio,iio-device.yaml

description: IIO sensor

compatible: "iio,sensor"

properties:
  sensor-device:
    type: phandle
    required: true

  sensor-channels:
    type: array

  buffer-name:
    type: string

  attrs:
    type: array
    default: []
    description: |
      TODO

  attr-names:
    type: string-array
    default: []
    description: |
      TODO

  stream-triggers:
    type: array
    description: |
      Sensor triggers, from dt-bindings/iio/sensor-triggers.h, that
      complete one streaming read. If absent, the backend reads once per
      block. Each trigger is armed with SENSOR_STREAM_DATA_INCLUDE.

# Detailed sensor channel setup.
child-binding:
  properties:
    channel:
      type: int
      required: true

    attrs:
      type: array
      default: []
      description: |
        TODO

    attr-names:
      type: string-array
      default: []
      description: |
        TODO
