include: base.yaml

description: IIO USB device class

compatible: "adi,iio-usb"

on-bus: usb

properties:
  num-pipes:
    type: int
    default: 3
    description: |
      Number of USB bulk endpoint pairs (pipes). Pipe 0 is the IIOD
      command channel. Additional pipes are used for data streaming
      (one per concurrent buffer/stream). Each pipe requires one IN
      and one OUT bulk endpoint.

  rx-buf-size:
    type: int
    default: 512
    description: |
      Maximum buffer size in bytes for a single USB bulk receive
      transfer. Must match the bulk endpoint max packet size or be
      a multiple of it. Transfers are capped at the max packet size
      the bus is actually running at.

  rx-depth:
    type: int
    default: 2
    min: 2
    description: |
      Receive buffers each pipe may hold at once: one armed on the
      endpoint and one being read by the interpreter, so the endpoint
      does not go bare between packets. The class allocates
      num-pipes * rx-depth of them and hands them out under a
      per-pipe credit, so a pipe can never hold more.

  tx-buf-size:
    type: int
    default: 64
    description: |
      Size in bytes of each TX chunk when transmitting data over USB.
      Smaller values reduce peak buffer pool usage at the cost of
      more USB transactions.
