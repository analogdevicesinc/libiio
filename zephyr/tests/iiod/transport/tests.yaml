# Requires the libiio Python bindings on the host; uart also requires socat.

common:
  tags:
    - libiio
    - iiod
  platform_allow:
    - native_sim
  harness: pytest

tests:
  libiio.iiod.transport.network:
    extra_args:
      - SNIPPET=iiod-network
    integration_platforms:
      - native_sim
    timeout: 120
    harness_config:
      pytest_root:
        - pytest/test_iiod.py
      pytest_dut_scope: session
      pytest_args:
        - --iiod-transport=network

  libiio.iiod.transport.uart:
    extra_args:
      - SNIPPET=iiod-console
    integration_platforms:
      - native_sim
    harness_config:
      pytest_root:
        - pytest/test_iiod.py
      pytest_dut_scope: session
      pytest_args:
        - --iiod-transport=uart

  libiio.iiod.transport.uart.multithread:
    extra_args:
      - SNIPPET=iiod-console
      - CONFIG_LIBIIO_MULTITHREADING=y
    integration_platforms:
      - native_sim
    timeout: 120
    harness_config:
      pytest_root:
        - pytest/test_iiod.py
      pytest_dut_scope: session
      pytest_args:
        - --iiod-transport=uart

  # Requires usbip, vhci-hcd, a udev rule for VID 0456 and passwordless sudo.
  libiio.iiod.transport.usb:
    tags: usb-hostreq
    extra_args:
      - SNIPPET=iiod-usb
    timeout: 60
    harness_config:
      pytest_root:
        - pytest/test_iiod.py
      pytest_dut_scope: session
      pytest_args:
        - --iiod-transport=usb
