common:
  tags: iiod

tests:
  zephyr-iio.iiod.usb.pytest:
    # Needs privileged one-time host setup (usbip client, TAP interface,
    # vhci_hcd, udev rule -- see conftest.py's _usb_context()), so no
    # integration_platforms. Run manually with:
    #   west twister -p native_sim --test sample.iiod.usb.pytest
    tags: usb-hostreq
    extra_args:
      - SNIPPET=iiod-usb
      # Overlays/confs set here, not via CMakeLists.txt's Kconfig-gated
      # append, which gets shadowed once EXTRA_DTC_OVERLAY_FILE is set.
      - EXTRA_DTC_OVERLAY_FILE=adc-emul.overlay;sensor-emul.overlay
      - EXTRA_CONF_FILE=adc-emul.conf;sensor-emul.conf
    extra_configs:
      - CONFIG_LIBIIO_IIOD_ADC_EMUL=y
      - CONFIG_LIBIIO_IIOD_SENSOR_EMUL=y
    platform_allow:
      - native_sim
    harness: pytest
    timeout: 60
    harness_config:
      pytest_root:
        - pytest/test_iiod.py
      pytest_dut_scope: session
      pytest_args:
        - --iiod-transport=usb

  zephyr-iio.iiod.network.pytest:
    extra_args:
      - SNIPPET=iiod-network
      - CONFIG_LIBIIO_IIOD_ADC_EMUL=y
      - CONFIG_LIBIIO_IIOD_SENSOR_EMUL=y
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
    harness: pytest
    timeout: 120
    harness_config:
      pytest_root:
        - pytest/test_iiod.py
      pytest_dut_scope: session
      pytest_args:
        - --iiod-transport=network

  zephyr-iio.iiod.uart.pytest:
    extra_args:
      - SNIPPET=iiod-console
      - CONFIG_LIBIIO_IIOD_ADC_EMUL=y
      - CONFIG_LIBIIO_IIOD_SENSOR_EMUL=y
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
    harness: pytest
    harness_config:
      pytest_root:
        - pytest/test_iiod.py
      pytest_dut_scope: session
      pytest_args:
        - --iiod-transport=uart

  zephyr-iio.iiod.uart.multithread.pytest:
    extra_args:
      - SNIPPET=iiod-console
      - CONFIG_LIBIIO_IIOD_ADC_EMUL=y
      - CONFIG_LIBIIO_IIOD_SENSOR_EMUL=y
      - CONFIG_LIBIIO_MULTITHREADING=y
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
    harness: pytest
    timeout: 120
    harness_config:
      pytest_dut_scope: session
      pytest_args:
        - --iiod-transport=uart
