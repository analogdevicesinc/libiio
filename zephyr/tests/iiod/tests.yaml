common:
  tags: iiod

tests:
  zephyr-iio.iiod.usb.pytest:
    # Needs privileged one-time host setup (usbip client, TAP interface,
    # vhci_hcd, udev rule -- see conftest.py's _usb_context()), so no
    # integration_platforms. All USB scenarios share the DUT IP 192.0.2.1 on
    # the zeth interface, so run them one at a time (-j 1), e.g.:
    #   west twister -p native_sim -T tests/iiod -j 1 --test zephyr-iio.iiod.usb.pytest
    tags: usb-hostreq
    extra_args:
      - SNIPPET=iiod-usb
      # Overlays/confs set here, not via CMakeLists.txt's Kconfig-gated
      # append, which gets shadowed once EXTRA_DTC_OVERLAY_FILE is set.
      - EXTRA_DTC_OVERLAY_FILE=adc-emul.overlay;sensor-emul.overlay
      - EXTRA_CONF_FILE=adc-emul.conf;sensor-emul.conf
    extra_configs:
      - CONFIG_LIBIIO_IIOD_ADC_EMUL=y
      - CONFIG_LIBIIO_IIOD_SENSOR_EMUL=y
      - CONFIG_LIBIIO_IIOD_V0_COMPAT=y
    platform_allow:
      - native_sim
    harness: pytest
    timeout: 60
    harness_config:
      pytest_root:
        - pytest/test_iiod.py
      pytest_dut_scope: session
      pytest_args:
        - --iiod-transport=usb
        - --iiod-v0-compat=y

  zephyr-iio.iiod.usb.no_v0_compat.pytest:
