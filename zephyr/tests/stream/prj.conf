CONFIG_ZTEST=y

CONFIG_POSIX_API=y
CONFIG_LIBIIO=y
CONFIG_LIBIIO_STREAMING=y

# Fixture sensor whose decoder answers only for SENSOR_CHAN_ACCEL_XYZ
