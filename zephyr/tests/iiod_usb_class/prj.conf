CONFIG_ZTEST=y
CONFIG_ASSERT=y

CONFIG_POSIX_API=y
# libiio needs GNU-style static constructors, or the ARM link fails.
CONFIG_STATIC_INIT_GNU=y
CONFIG_LIBIIO=y
CONFIG_LIBIIO_IIOD_USB=y
CONFIG_USB_DEVICE_STACK_NEXT=y

# The test brings the device up itself, after the host is listening: the virtual
# bus signals the connection when the device is enabled, so a device enabled from
# SYS_INIT would announce itself before there is a host to hear it.
CONFIG_LIBIIO_IIOD_USB_INIT=n

# The test is the host: an in-image USB host stack on the other end of the
# virtual bus, driven directly. No USB/IP, so no root and no kernel involvement.
CONFIG_USB_HOST_STACK=y
CONFIG_UHC_BUF_COUNT=32
CONFIG_UHC_XFER_COUNT=32

# The virtual UHC/UDC pair needs a fine-grained clock for transaction timing.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000000

# Errors only. The class logs one line per arming at debug level, which is far
# more than the assertions need.
CONFIG_LOG=y
CONFIG_LIBIIO_LOG_LEVEL_ERR=y
