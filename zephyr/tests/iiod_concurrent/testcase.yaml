tests:
  libiio.iiod.concurrent:
    tags:
      - libiio
      - iiod
    extra_args:
      - SNIPPET=iiod-network
    # Needs the host network stack to open several sockets to the DUT.
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
    harness: pytest
    timeout: 180
    harness_config:
      pytest_dut_scope: session
