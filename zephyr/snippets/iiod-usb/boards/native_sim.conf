# USB/IP server — exports the virtual UDC to the Linux kernel over TCP
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_USB_HOST_STACK=y
CONFIG_USBIP=y

# Use Linux host TCP stack directly — no TAP interface or net-setup.sh needed
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y

# Virtual UHC/UDC bus needs fine-grained clock for USB transaction timing
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000000
CONFIG_UHC_BUF_COUNT=32
CONFIG_UHC_XFER_COUNT=32
