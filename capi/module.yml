#
# libiio as a CAPI module: this directory, libiio's CAPI port. An
# application lists it under depends.packages, with libiio's git address and
# subdir: capi, and adds this directory to its build (libiio::capi).
name: libiio
type: middleware
version: "1.1.0"
description: "libiio on CAPI: serves an application's devices to libiio clients (iio_info, iio_attr, iio_rwdev)"

# The capi version this port is written against.
capi_version_requirement: ">=0.9.0"

depends:
  interfaces:
    - alloc
    - time
    - log
