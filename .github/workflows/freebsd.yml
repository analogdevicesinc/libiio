name: FreeBSD Test

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ["14.4"]
    name: Test FreeBSD
    steps:
    - uses: actions/checkout@v5
    - name: Install libiio dependencies of FreeBSD
      id: test
      uses: vmactions/freebsd-vm@v1.5.9
      with:
        release: ${{ matrix.os }}
        usesh: true
        prepare: |
          pkg update
          pkg install -y git cmake-core ninja libxml2 bison flex libserialport avahi doxygen graphviz pkgconf
        run: |
         mkdir build
         cd build
         cmake .. -DWITH_SERIAL_BACKEND=ON -DWITH_EMU_BACKEND=ON -DWITH_IIOD_EMU=ON -DLICENSE_CHECK=ON
         make



