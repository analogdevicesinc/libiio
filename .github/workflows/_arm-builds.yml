name: ARM Builds

on:
  workflow_call:
    inputs:
      build-type:
        required: true
        type: string

jobs:
  arm-native:
    name: ${{ matrix.artifact-name }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04
          - image: ubuntu:22.04
            platform-flag: ''
            artifact-name: Ubuntu-22.04-arm64v8
          - image: arm32v7/ubuntu:22.04
            platform-flag: '--platform linux/arm/v7'
            artifact-name: Ubuntu-22.04-arm32v7

          # Ubuntu 26.04
          - image: ubuntu:26.04
            platform-flag: ''
            artifact-name: Ubuntu-26.04-arm64v8
          - image: arm32v7/ubuntu:26.04
            platform-flag: '--platform linux/arm/v7'
            artifact-name: Ubuntu-26.04-arm32v7

          # Debian 12 (bookworm)
          - image: debian:bookworm
            platform-flag: ''
            artifact-name: Debian-12-arm64
          - image: arm32v7/debian:bookworm
            platform-flag: '--platform linux/arm/v7'
            artifact-name: Debian-12-armhf

          # Debian 13 (trixie)
          - image: debian:trixie
            platform-flag: ''
            artifact-name: Debian-13-arm64
          - image: arm32v7/debian:trixie
            platform-flag: '--platform linux/arm/v7'
            artifact-name: Debian-13-armhf
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/checkout@v7
        with:
          repository: analogdevicesinc/shared-actions
          path: shared-actions
          fetch-depth: 1

      - name: Get version
        id: version
        run: |
          version=$(grep -oP '(?<=VERSION )[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build deb
        run: |
          set -e
          docker run -d --name builder \
            ${{ matrix.platform-flag }} --privileged \
            -v "${{ github.workspace }}:${{ github.workspace }}" \
            -w "${{ github.workspace }}" \
            -e DEBIAN_FRONTEND=noninteractive \
            -e GITHUB_WORKSPACE="${{ github.workspace }}" \
            -e VERSION="${{ steps.version.outputs.version }}" \
            -e WORKING_DIRECTORY="${{ github.workspace }}" \
            -e IGNORE_PATH="shared-actions" \
            "${{ matrix.image }}" sleep infinity
          docker exec builder bash -c "apt-get update && apt-get install -y curl"
          docker exec builder bash shared-actions/deb-generator-action/build-deb.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: artifacts

  cross-arch:
    name: ${{ matrix.artifact-name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            arch: ppc64le
            artifact-name: Ubuntu-22.04-ppc64le
          - image: ubuntu:22.04
            arch: s390x
            artifact-name: Ubuntu-22.04-s390x
          - image: ubuntu:26.04
            arch: ppc64le
            artifact-name: Ubuntu-26.04-ppc64le
          - image: ubuntu:26.04
            arch: s390x
            artifact-name: Ubuntu-26.04-s390x
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/checkout@v7
        with:
          repository: analogdevicesinc/shared-actions
          path: shared-actions
          fetch-depth: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Get version
        id: version
        run: |
          version=$(grep -oP '(?<=VERSION )[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build deb
        run: |
          set -e
          docker run -d --name builder \
            --platform "linux/${{ matrix.arch }}" --privileged \
            -v "${{ github.workspace }}:${{ github.workspace }}" \
            -w "${{ github.workspace }}" \
            -e DEBIAN_FRONTEND=noninteractive \
            -e GITHUB_WORKSPACE="${{ github.workspace }}" \
            -e VERSION="${{ steps.version.outputs.version }}" \
            -e WORKING_DIRECTORY="${{ github.workspace }}" \
            -e IGNORE_PATH="shared-actions" \
            "${{ matrix.image }}" sleep infinity
          docker exec builder bash -c "apt-get update && apt-get install -y curl"
          docker exec builder bash shared-actions/deb-generator-action/build-deb.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: artifacts
