name: Build and Deploy

on:
  push:
    branches:
      - main
      - next_stable
      - dev
      - libiio-v0
      - 'staging/*'
      - '20*'
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
      - 'doc/**'
      - '.gitignore'
      - 'LICENSE*'
      - 'COPYING*'
      - 'CODE_OF_CONDUCT*'
      - 'CONTRIBUTING*'
  pull_request:
    branches:
      - main
      - next_stable
      - dev
      - '20*'
    paths-ignore:
      - '**/*.md'
      - 'doc/**'
      - '.gitignore'
      - 'LICENSE*'
      - 'COPYING*'
      - 'CODE_OF_CONDUCT*'
      - 'CONTRIBUTING*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  #############################################
  # Configuration
  #############################################
  config:
    runs-on: ubuntu-latest
    outputs:
      build-type: ${{ steps.set.outputs.build-type }}
      is-main: ${{ steps.set.outputs.is-main }}
      is-release: ${{ steps.set.outputs.is-release }}
      cloudsmith-version: ${{ steps.set.outputs.cloudsmith-version }}
    steps:
      - id: set
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "build-type=Release" >> "${GITHUB_OUTPUT}"
            echo "is-release=true" >> "${GITHUB_OUTPUT}"
            echo "cloudsmith-version=${GITHUB_REF#refs/tags/}" >> "${GITHUB_OUTPUT}"
          else
            echo "build-type=RelWithDebInfo" >> "${GITHUB_OUTPUT}"
            echo "is-release=false" >> "${GITHUB_OUTPUT}"
            branch="${GITHUB_REF#refs/heads/}"
            echo "cloudsmith-version=${branch}-${GITHUB_SHA::7}" >> "${GITHUB_OUTPUT}"
          fi
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "is-main=true" >> "${GITHUB_OUTPUT}"
          else
            echo "is-main=false" >> "${GITHUB_OUTPUT}"
          fi

  #############################################
  # Builds
  #############################################
  linux:
    needs: config
    uses: ./.github/workflows/_linux-builds.yml
    with:
      build-type: ${{ needs.config.outputs.build-type }}

  windows:
    needs: config
    uses: ./.github/workflows/_windows-builds.yml
    with:
      build-type: ${{ needs.config.outputs.build-type }}
      is-release: ${{ needs.config.outputs.is-release }}

  macos:
    needs: config
    uses: ./.github/workflows/_macos-builds.yml
    with:
      build-type: ${{ needs.config.outputs.build-type }}

  arm:
    needs: config
    uses: ./.github/workflows/_arm-builds.yml
    with:
      build-type: ${{ needs.config.outputs.build-type }}

  mcu:
    needs: config
    uses: ./.github/workflows/_mcu-builds.yml
    with:
      build-type: ${{ needs.config.outputs.build-type }}

  #############################################
  # Check Artifacts
  #############################################
  check-artifacts:
    if: needs.config.outputs.is-main == 'true' || needs.config.outputs.is-release == 'true'
    needs: [config, linux, windows, macos, arm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: tfcollins/libiio_ubuntu_20_04-ci:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build artifact manifest
        run: |
          set -e
          mkdir build && cd build
          cmake ..
          mkdir artifacts

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: build/artifacts/

      - name: Check files
        run: ./CI/scripts/prepare_assets.sh check
        env:
          BUILD_SOURCESDIRECTORY: ${{ github.workspace }}
          BUILD_ARTIFACTSTAGINGDIRECTORY: ${{ github.workspace }}/build/artifacts

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: Artifact manifest
          path: build/artifact_manifest.txt

  #############################################
  # Push to Cloudsmith
  #############################################
  push-cloudsmith:
    if: needs.config.outputs.is-main == 'true'
    needs: [config, check-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ github.workspace }}/artifacts

      - name: Prepare artifacts
        run: ./CI/scripts/prepare_assets.sh swdownloads
        env:
          BUILD_SOURCESDIRECTORY: ${{ github.workspace }}
          BUILD_ARTIFACTSTAGINGDIRECTORY: ${{ github.workspace }}/artifacts

      - name: Checkout wiki-scripts
        uses: actions/checkout@v4
        with:
          repository: analogdevicesinc/wiki-scripts
          path: wiki-scripts
          sparse-checkout: utils/cloudsmith_utils
          fetch-depth: 1

      - name: Install Cloudsmith CLI
        run: pip install cloudsmith-cli

      - name: Upload to Cloudsmith
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          python3 wiki-scripts/utils/cloudsmith_utils/upload_to_cloudsmith.py \
            --repo external \
            --version "libiio/${{ needs.config.outputs.cloudsmith-version }}/" \
            --local_path "${{ github.workspace }}/artifacts" \
            --no_rel_path \
            --max_workers 5

  #############################################
  # Push to GitHub Release
  #############################################
  push-github-release:
    if: needs.config.outputs.is-release == 'true'
    needs: [config, check-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ github.workspace }}/artifacts

      - name: Prepare assets for release
        run: ./CI/scripts/prepare_assets.sh release
        env:
          BUILD_SOURCESDIRECTORY: ${{ github.workspace }}
          BUILD_ARTIFACTSTAGINGDIRECTORY: ${{ github.workspace }}/artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: "Libiio release ${{ github.ref_name }}"
          files: ${{ github.workspace }}/artifacts/*
          generate_release_notes: true
