# DAQIRI socket engine for the daqiri: UDP loopback tests that check exact
# counters (daqiri_udp_loopback, daqiri_udp_equivalence): as
# socket-udp-loopback.yaml, one UDP server interface on 127.0.0.1:25101 whose
# socket is connect()ed to 127.0.0.1:25102 (test senders must bind that), but
# with max_payload_size 1472. The backend then asks for 1456-byte payloads
# (1472 less the datagram header), and even the kernel's default receive
# buffer (208 KiB, what the socket keeps with rcvbuf=0; the backend asks for
# 4 MiB otherwise) holds some 90 such datagrams against a dozen of 9216
# bytes: a test that sends fewer than that per enable loses none, however
# late the engine's receive thread runs. 256 packet buffers keep the engine
# from running out before the kernel does.
daqiri:
  cfg:
    version: 1
    stream_type: socket
    master_core: 0
    memory_regions:
    - name: HOST_MR
      kind: host
      affinity: 0
      num_bufs: 256
      buf_size: 2048
    interfaces:
    - name: data
      address: 127.0.0.1
      socket_config:
        mode: server
        local_addr: 'udp://127.0.0.1:25101'
        remote_addr: 'udp://127.0.0.1:25102'
        max_payload_size: 1472
      rx:
        queues:
        - name: rx0
          id: 0
          cpu_core: 0
          batch_size: 8
          memory_regions:
          - HOST_MR
