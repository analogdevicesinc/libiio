# IIOD over TCP: lwIP raw API on an ADIN1110 10BASE-T1L MAC-PHY.
# Static address; the host reaches it as ip:192.0.2.1.
CONFIG_UART=y
CONFIG_IRQ=y
CONFIG_GPIO=y
CONFIG_TIMER=y
CONFIG_DMA=y
CONFIG_SPI=y
CONFIG_NET=y
CONFIG_LWIP=y
CONFIG_ADIN1110=y
CONFIG_NO_OS_STATIC_IP=y
CONFIG_NO_OS_IP="192.0.2.1"
CONFIG_NO_OS_NETMASK="255.255.255.0"
CONFIG_NO_OS_GATEWAY="192.0.2.2"
